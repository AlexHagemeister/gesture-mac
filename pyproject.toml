[project]
name = "gesture-mac"
version = "0.1.0"
description = "Webcam hand gestures as a Mac peripheral: a menu-bar app that turns pinches and poses into keys, scroll, and system controls."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==0.10.21",
    "numpy<2",
    "opencv-python>=4.10",
    "pyobjc-framework-Quartz>=10",
    "pyobjc-framework-AVFoundation>=10",
    "rumps>=0.4",
    "aiohttp>=3.14.3",
    "pyobjc-framework-webkit>=12.2.2",
]

[project.scripts]
gesture-mac = "gesture_mac.app.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-aiohttp>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gesture_mac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
